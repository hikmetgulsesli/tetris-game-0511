<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Playfield - StackEngine Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#11131b",
                        "surface-container-lowest": "#0c0e16",
                        "on-tertiary-container": "#ffede6",
                        "on-tertiary": "#581e00",
                        "on-surface-variant": "#c3c6d7",
                        "on-secondary": "#233144",
                        "error-container": "#93000a",
                        "surface-tint": "#b4c5ff",
                        "error": "#ffb4ab",
                        "outline": "#8d90a0",
                        "on-secondary-container": "#abb9d1",
                        "inverse-on-surface": "#2e3039",
                        "on-surface": "#e1e2ed",
                        "surface-variant": "#32343d",
                        "surface-container-low": "#191b23",
                        "primary-fixed": "#dbe1ff",
                        "surface": "#11131b",
                        "primary": "#b4c5ff",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#360f00",
                        "tertiary-container": "#bc4800",
                        "primary-container": "#2563eb",
                        "on-background": "#e1e2ed",
                        "on-secondary-fixed": "#0d1c2e",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-secondary-fixed-variant": "#3a485b",
                        "outline-variant": "#434655",
                        "inverse-surface": "#e1e2ed",
                        "on-error": "#690005",
                        "surface-bright": "#373942",

                        "inverse-primary": "#0053db",
                        "on-tertiary-fixed-variant": "#7d2d00",

                    borderRadius: {

                    spacing: {
                        "container-padding": "24px",
                        "unit": "8px",
                        "grid-gutter": "16px",
                        "element-gap": "12px",
                        "stack-tight": "4px"
                    },
                    fontFamily: {
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "score-display": ["Inter"],
                        "label-lg": ["Inter"]
                    },
                    fontSize: {
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "score-display": ["48px", { "lineHeight": "1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "label-lg": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .mino-bevel {
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.2), inset -2px -2px 4px rgba(0, 0, 0, 0.3);
        }
        .matrix-grid {
            background-image: 
                linear-gradient(to right, rgba(67, 70, 85, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(67, 70, 85, 0.2) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden flex flex-col">
<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 bg-surface-container border-b border-outline-variant flex justify-between items-center px-grid-gutter h-16 shadow-sm">
<div class="font-headline-md text-headline-md font-bold text-primary">StackEngine Pro</div>
<div class="hidden md:flex gap-8 h-full items-end">
<a class="text-primary border-b-2 border-primary pb-1 font-label-lg text-label-lg mb-4 hover:text-on-surface transition-colors duration-200" href="#">Arena</a>
<a class="text-on-surface-variant pb-[6px] font-label-lg text-label-lg mb-4 hover:text-on-surface transition-colors duration-200" href="#">Leaderboard</a>
<a class="text-on-surface-variant pb-[6px] font-label-lg text-label-lg mb-4 hover:text-on-surface transition-colors duration-200" href="#">Tournaments</a>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-on-surface transition-colors duration-200 active:scale-95 transition-transform flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
<button class="text-on-surface-variant hover:text-on-surface transition-colors duration-200 active:scale-95 transition-transform flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
<div class="w-8 h-8 rounded-full border border-outline-variant overflow-hidden shrink-0">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A sleek, modern avatar portrait of a professional gamer. The lighting is high-contrast and slightly dramatic, featuring cool blue edge lighting that reflects the corporate modern aesthetic of the StackEngine platform. The subject is looking directly forward with a focused, intense expression, set against a completely dark slate background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBtseLp-Fl5VmMLwqria-SP3C9zNxbBmYCaWKgBSp-JkupHDiLDv_nseNVbDfqsSHNFJXInDRu_RcjbFk-Hh0MFcDKcrg9O1NP3CmaWPDg77uqA_Y6GsKW6c4OsHXxFlIdp6exwOB7cII5fp3K6cot0z1elwOA9vZ2XTTY2SF8e9s6eX5441VuQpsg_ORkCSOzD4AO-n9h6x2lr60XKVU7uy5DwarfJTQKcmf8JSf8XGncszKIpplQjHRTmoiXBm3eZdOJTt2o0z8c"/>
</div>
</div>
</nav>
<div class="flex flex-1 pt-16 h-full">
<!-- SideNavBar -->
<aside class="hidden md:flex flex-col fixed left-0 top-0 pt-16 h-full w-64 bg-surface-container-low border-r border-outline-variant z-40 transition-all duration-200 ease-in-out">
<div class="p-6 border-b border-outline-variant flex flex-col items-center gap-4">
<div class="w-20 h-20 rounded-full border-2 border-primary overflow-hidden shadow-lg p-1 bg-surface-container">
<img alt="Pro Player Icon" class="w-full h-full object-cover rounded-full" data-alt="A stylized, close-up portrait of a high-ranking player in a dark, atmospheric setting. Subtle neon blue highlights contour the silhouette, matching the primary brand color. The overall vibe is highly professional, resembling a corporate esports roster photo rather than a casual snapshot, with deep blacks and sharp focus." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDWgIqhbiHUBCUuq--gc8nYYaVU_Xen5WYKzEyQUnGFnVMpfc4tBF5-SXz5oEPv-8vs7e-a4Y0Kd4sjqVUoaVRexDRb0ufAbmdfbYQ_GQdPu42g06Q1Eg9jdNKrRtgqH-833mUrB47p-uzhInvroJYT38ZinpYAfEl0txER50JzrHv2o6a2QkloX_YEzdrOu0fqTlPHiTULhvaJY7BMixMlIG9Sygk0wDTU2UD2vDbb7A-ovrE9X4TXEPCAliXGSkexrWllmbZpONy"/>
</div>
<div class="text-center">
<h2 class="font-headline-sm text-headline-sm text-primary">Pro League</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Rank: Grandmaster</p>
</div>
</div>
<nav class="flex-1 flex flex-col py-4 gap-1">
<a class="flex items-center gap-3 px-6 py-3 bg-primary-container text-on-primary-container border-l-4 border-primary font-label-lg text-label-lg transition-colors" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">videogame_asset</span>
                    Playfield
                </a>
<a class="flex items-center gap-3 px-6 py-3 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface border-l-4 border-transparent font-label-lg text-label-lg transition-colors" href="#">
<span class="material-symbols-outlined">menu</span>
                    Main Menu
                </a>
<a class="flex items-center gap-3 px-6 py-3 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface border-l-4 border-transparent font-label-lg text-label-lg transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
                    Settings
                </a>
<a class="flex items-center gap-3 px-6 py-3 text-on-surface-variant hover:bg-surface-variant hover:text-on-surface border-l-4 border-transparent font-label-lg text-label-lg transition-colors" href="#">
<span class="material-symbols-outlined">help</span>
                    Help
                </a>
</nav>
<div class="p-6 border-t border-outline-variant">
<button class="w-full bg-primary-container text-on-primary-container py-3 rounded font-label-lg text-label-lg hover:brightness-110 active:scale-95 transition-all shadow-md">
                    New Game
                </button>
</div>
</aside>
<!-- Main Content (Playfield) -->
<main class="flex-1 md:ml-64 bg-background p-container-padding flex items-center justify-center overflow-y-auto">
<div class="flex flex-col lg:flex-row gap-grid-gutter w-full max-w-5xl justify-center items-start">
<!-- Left Panel: Hold -->
<div class="hidden lg:flex flex-col gap-element-gap w-32 shrink-0 pt-8">
<div class="bg-surface-container border border-outline-variant rounded-lg p-4 flex flex-col items-start shadow-sm relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-white/[0.02] to-transparent pointer-events-none"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-4">Hold</span>
<div class="w-full h-24 bg-surface-container-lowest rounded border border-outline flex items-center justify-center relative">
<!-- Ghost Piece Representation (I-piece) -->
<div class="flex flex-col gap-[1px] opacity-40">
<div class="w-[18px] h-[18px] bg-secondary rounded-[3px] border border-secondary-container"></div>
<div class="w-[18px] h-[18px] bg-secondary rounded-[3px] border border-secondary-container"></div>
<div class="w-[18px] h-[18px] bg-secondary rounded-[3px] border border-secondary-container"></div>
<div class="w-[18px] h-[18px] bg-secondary rounded-[3px] border border-secondary-container"></div>
</div>
</div>
</div>
</div>
<!-- Center: Matrix -->
<div class="flex flex-col items-center">
<div class="bg-surface-container-highest border-2 border-outline-variant rounded-lg p-2 shadow-2xl relative">
<!-- Subtle ambient glow behind the board -->
<div class="absolute -inset-4 bg-primary/5 blur-xl rounded-full pointer-events-none -z-10"></div>
<!-- 10x20 Grid -->
<div class="w-[240px] h-[480px] bg-surface-dim relative overflow-hidden matrix-grid rounded border border-outline/30">
<!-- Falling Piece (T-Piece) -->
<div class="absolute top-[96px] left-[72px] flex flex-col gap-[1px]">
<div class="flex gap-[1px] ml-[25px]">
<div class="w-[23px] h-[23px] bg-primary rounded-[4px] mino-bevel"></div>
</div>
<div class="flex gap-[1px]">
<div class="w-[23px] h-[23px] bg-primary rounded-[4px] mino-bevel"></div>
<div class="w-[23px] h-[23px] bg-primary rounded-[4px] mino-bevel shadow-[0_4px_12px_rgba(37,99,235,0.4)] relative z-10"></div>
<div class="w-[23px] h-[23px] bg-primary rounded-[4px] mino-bevel"></div>
</div>
</div>
<!-- Ghost Preview -->
<div class="absolute bottom-[24px] left-[72px] flex flex-col gap-[1px] opacity-20">
<div class="flex gap-[1px] ml-[25px]">
<div class="w-[23px] h-[23px] border-2 border-primary rounded-[4px]"></div>
</div>
<div class="flex gap-[1px]">
<div class="w-[23px] h-[23px] border-2 border-primary rounded-[4px]"></div>
<div class="w-[23px] h-[23px] border-2 border-primary rounded-[4px]"></div>
<div class="w-[23px] h-[23px] border-2 border-primary rounded-[4px]"></div>
</div>
</div>
<!-- Landed Stack (Assorted colors) -->
<div class="absolute bottom-0 left-0 w-full">
<!-- Row 1 -->
<div class="flex gap-[1px] absolute bottom-0 left-0">
<div class="w-[23px] h-[23px] bg-tertiary rounded-[4px] mino-bevel"></div>
<div class="w-[23px] h-[23px] bg-tertiary rounded-[4px] mino-bevel"></div>
<div class="w-[23px] h-[23px] bg-error rounded-[4px] mino-bevel ml-[24px]"></div>
<div class="w-[23px] h-[23px] bg-error rounded-[4px] mino-bevel"></div>
<div class="w-[23px] h-[23px] bg-secondary rounded-[4px] mino-bevel ml-[48px]"></div>
<div class="w-[23px] h-[23px] bg-secondary rounded-[4px] mino-bevel"></div>
</div>
<!-- Row 2 -->
<div class="flex gap-[1px] absolute bottom-[24px] left-0">
<div class="w-[23px] h-[23px] bg-tertiary rounded-[4px] mino-bevel"></div>
<div class="w-[23px] h-[23px] bg-tertiary rounded-[4px] mino-bevel"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Right Panel: Stats & Next -->
<div class="flex flex-col gap-element-gap w-full lg:w-56 shrink-0 pt-8">
<!-- Score Card (Hero) -->
<div class="bg-surface-container border border-outline-variant rounded-lg p-5 flex flex-col items-start shadow-sm relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">Current Score</span>
<span class="font-score-display text-score-display text-on-surface tracking-tighter">14,250</span>
</div>
<div class="flex gap-element-gap w-full">
<!-- Level -->
<div class="bg-surface-container border border-outline-variant rounded-lg p-4 flex flex-col flex-1 shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Level</span>
<span class="font-headline-lg text-headline-lg text-primary">08</span>
</div>
<!-- Lines -->
<div class="bg-surface-container border border-outline-variant rounded-lg p-4 flex flex-col flex-1 shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Lines</span>
<span class="font-headline-lg text-headline-lg text-secondary">42</span>
</div>
</div>
<!-- Next Piece -->
<div class="bg-surface-container border border-outline-variant rounded-lg p-4 flex flex-col items-start shadow-sm mt-2">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-4">Next Piece</span>
<div class="w-full h-24 bg-surface-container-lowest rounded border border-outline flex items-center justify-center">
<!-- Z-Piece Representation -->
<div class="flex flex-col gap-[1px]">
<div class="flex gap-[1px]">
<div class="w-[18px] h-[18px] bg-error rounded-[3px] mino-bevel"></div>
<div class="w-[18px] h-[18px] bg-error rounded-[3px] mino-bevel"></div>
</div>
<div class="flex gap-[1px] ml-[19px]">
<div class="w-[18px] h-[18px] bg-error rounded-[3px] mino-bevel"></div>
<div class="w-[18px] h-[18px] bg-error rounded-[3px] mino-bevel"></div>
</div>
</div>
</div>
</div>
<!-- Controls -->
<div class="flex flex-col gap-3 mt-6">
<button class="w-full bg-primary-container text-on-primary-container font-label-lg text-label-lg py-3 rounded-lg shadow-[0_2px_0_rgba(0,0,0,0.5)] active:translate-y-[2px] active:shadow-none hover:brightness-110 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
                            Pause
                        </button>
<div class="flex gap-3">
<button class="flex-1 border border-outline-variant text-on-surface font-label-lg text-label-lg py-2.5 rounded-lg hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">restart_alt</span>
                                Reset
                            </button>
<button class="flex-1 border border-outline-variant text-on-surface font-label-lg text-label-lg py-2.5 rounded-lg hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
                                Menu
                            </button>
</div>
</div>
</div>
</div>
</main>
</div>
</body></html>
