<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StackEngine Pro - Game Over</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#11131b",
                        "surface-container-lowest": "#0c0e16",
                        "on-tertiary-container": "#ffede6",
                        "on-tertiary": "#581e00",
                        "on-surface-variant": "#c3c6d7",
                        "on-secondary": "#233144",
                        "error-container": "#93000a",
                        "surface-tint": "#b4c5ff",
                        "error": "#ffb4ab",
                        "outline": "#8d90a0",
                        "on-secondary-container": "#abb9d1",
                        "inverse-on-surface": "#2e3039",
                        "on-surface": "#e1e2ed",
                        "surface-variant": "#32343d",
                        "surface-container-low": "#191b23",
                        "primary-fixed": "#dbe1ff",
                        "surface": "#11131b",
                        "primary": "#b4c5ff",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#360f00",
                        "tertiary-container": "#bc4800",
                        "primary-container": "#2563eb",
                        "on-background": "#e1e2ed",
                        "on-secondary-fixed": "#0d1c2e",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-secondary-fixed-variant": "#3a485b",
                        "outline-variant": "#434655",
                        "inverse-surface": "#e1e2ed",
                        "on-error": "#690005",
                        "surface-bright": "#373942",
                        "primary-fixed-dim": "#b4c5ff",
                        "inverse-primary": "#0053db",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-container": "#1d1f27",
                        "tertiary-fixed": "#ffdbcd",
                        "secondary-fixed": "#d5e3fc",
                        "on-primary-fixed": "#00174b",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container-highest": "#32343d",
                        "secondary": "#b9c7df",
                        "surface-container-high": "#282a32",
                        "on-primary": "#002a78",
                        "secondary-container": "#3c4a5e",
                        "surface-dim": "#11131b",
                        "tertiary": "#ffb596",
                        "tertiary-fixed-dim": "#ffb596"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "unit": "8px",
                        "grid-gutter": "16px",
                        "element-gap": "12px",
                        "stack-tight": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "score-display": ["Inter"],
                        "label-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "score-display": ["48px", { "lineHeight": "1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "label-lg": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md">
<!-- Main Results Container -->
<main class="w-full max-w-3xl px-container-padding py-12 flex flex-col items-center">
<!-- Header -->
<header class="text-center mb-grid-gutter flex flex-col items-center gap-stack-tight">
<span class="font-headline-sm text-headline-sm text-error tracking-widest uppercase">Game Over</span>
<h1 class="font-score-display text-score-display text-primary mt-unit">1,245,890</h1>
<div class="flex items-center gap-2 mt-2 text-on-surface-variant font-label-lg text-label-lg">
<span class="material-symbols-outlined" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span>Personal Best: 1,150,000</span>
<span class="material-symbols-outlined text-tertiary" data-icon="arrow_upward" style="font-variation-settings: 'FILL' 1;">arrow_upward</span>
</div>
</header>
<!-- Stats Bento Grid -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-grid-gutter w-full mb-8">
<!-- Stat Card: Lines Cleared -->
<div class="bg-surface-container-low border border-outline-variant p-element-gap rounded-lg flex flex-col gap-stack-tight">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Lines Cleared</span>
<span class="font-headline-md text-headline-md text-on-surface">142</span>
</div>
<!-- Stat Card: Max Combo -->
<div class="bg-surface-container-low border border-outline-variant p-element-gap rounded-lg flex flex-col gap-stack-tight">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Max Combo</span>
<span class="font-headline-md text-headline-md text-primary">12x</span>
</div>
<!-- Stat Card: Time Played -->
<div class="bg-surface-container-low border border-outline-variant p-element-gap rounded-lg flex flex-col gap-stack-tight">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Time Played</span>
<span class="font-headline-md text-headline-md text-on-surface">04:32</span>
</div>
<!-- Stat Card: Rank -->
<div class="bg-surface-container-low border border-outline-variant p-element-gap rounded-lg flex flex-col gap-stack-tight relative overflow-hidden">
<div class="absolute right-[-10px] bottom-[-10px] opacity-10">
<span class="material-symbols-outlined text-[64px]" data-icon="military_tech" style="font-variation-settings: 'FILL' 1;">military_tech</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Rank</span>
<span class="font-headline-md text-headline-md text-tertiary">S+</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-element-gap w-full max-w-md justify-center mt-grid-gutter">
<button class="flex-1 bg-primary-container text-on-primary-container font-label-lg text-label-lg py-3 px-6 rounded-DEFAULT flex items-center justify-center gap-2 hover:bg-inverse-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined" data-icon="replay">replay</span>
                Play Again
            </button>
<button class="flex-1 border border-outline-variant text-on-surface bg-transparent font-label-lg text-label-lg py-3 px-6 rounded-DEFAULT flex items-center justify-center gap-2 hover:bg-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined" data-icon="share">share</span>
                Share Score
            </button>
</div>
<div class="mt-element-gap">
<button class="text-on-surface-variant font-label-lg text-label-lg hover:text-primary transition-colors flex items-center gap-2 py-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
                Back to Menu
            </button>
</div>
</main>
</body></html>
